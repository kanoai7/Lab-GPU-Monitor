<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Lab GPU Monitor' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">◆</span>
            <span class="brand-name">{{ title or 'Lab GPU Monitor' }}</span>
        </div>
        <nav class="topnav">
            <span id="status-pill" class="pill">同步中… / syncing…</span>
            <a class="navlink" href="{{ url_for('get_settings_page') }}">设置 / Settings</a>
            {% if auth_on %}<a class="navlink" href="{{ url_for('logout') }}">登出 / Logout</a>{% endif %}
            <button id="theme-toggle" class="icon-btn" title="切换主题 / Toggle theme">🌓</button>
        </nav>
    </header>

    <main id="dashboard" class="container">
        <div id="empty-hint" class="empty-hint" hidden>
            还没有配置任何 Agent。请到 <a href="{{ url_for('get_settings_page') }}">设置</a> 添加。<br>
            No agents configured yet — add them in <a href="{{ url_for('get_settings_page') }}">Settings</a>.
        </div>
        <div id="cards" class="cards"></div>
    </main>

    <footer class="footer">Lab GPU Monitor · v1</footer>
</body>
</html>
