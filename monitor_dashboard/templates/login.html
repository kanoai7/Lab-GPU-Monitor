<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / Login · {{ title or 'Lab GPU Monitor' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="center-page">
    <form class="auth-card" method="POST">
        <div class="brand brand-lg">
            <span class="brand-mark">◆</span>
            <span class="brand-name">{{ title or 'Lab GPU Monitor' }}</span>
        </div>
        <p class="muted">请输入访问密码 / Enter the access password</p>
        {% if error %}<div class="alert-box">{{ error }}</div>{% endif %}
        <input class="field" type="password" name="password" placeholder="密码 / Password" autofocus required>
        <button class="btn btn-primary" type="submit">登录 / Sign in</button>
    </form>
</body>
</html>
